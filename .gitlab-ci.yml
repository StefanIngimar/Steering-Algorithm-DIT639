# Which Docker image shall be used on the GitLab runner?
image: registry.git.chalmers.se/courses/dit638/students/2025-group-04/docker:24.0.5


# Details about how to connect to the Docker service to run this build.
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_CLI_EXPERIMENTAL: enabled

services:
  - name: registry.git.chalmers.se/courses/dit638/students/2025-group-04/docker:24.0.5-dind
    alias: docker

stages:
 # - build
  - performance-test
  - deploy

# Display information before we start the build.
before_script:
  - docker --version
  - docker info
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# This section describes what shall be done to build and test the project.
# rules: project must be built and tested on any push, except for tagged releases. https://docs.gitlab.com/ci/yaml/
build-and-test:
  tags:
    - docker-build
  stage: build
  script:
    # Ensure experimental features are enabled for buildx
    - docker buildx version || (echo "Installing buildx..." && mkdir -p ~/.docker/cli-plugins && wget -qO ~/.docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.11.2/buildx-v0.11.2.linux-amd64 && chmod +x ~/.docker/cli-plugins/docker-buildx)
    - docker buildx create --use
    - docker buildx inspect --bootstrap
    # Fallback tag: use ref name if no tag is available
    - export IMAGE_TAG=${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}
    # Build for multiple platforms (amd64 and arm64) and push to the registry
    - docker buildx build --no-cache --progress=plain --provenance=false --platform linux/amd64,linux/arm/v7 -f Dockerfile -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
  rules: #rules: build and test on any push, except tagged releases
      - if: "$CI_COMMIT_TAG"
        when: never
      - when: always

# Generate code coverage reports and visualization 
# https://docs.gitlab.com/ci/testing/code_coverage/
#
# - should build the executables to emit coverage data
#   - value of CMAKE_BUILD_TYPE determines the flags passed to the compiler 
#   - in this case, it is necessary to set the value to Profile so that the 
#     necessary coverage flags will be passed to the compiler 
# - gcovr uses the generated coverage data to creat the test coverage reports 
#   in different file formats which will be stored as artifacts on GitLab
# - artificats will be generated on 'merge_request_event' and expire after 45 days 
# - can browse, download, and view the report artifacts locally  
# - intended to publish the coverage.html but GitLab Pages is not enabled for the 
#   project by admin 
code-coverage:
  tags:
    - docker-build
  stage: build
  image: registry.git.chalmers.se/courses/dit638/students/2025-group-04/alpine:3.21
  before_script:
    - apk add --update build-base cmake gcovr
  variables:
    SRC_DIR: "${CI_PROJECT_DIR}/demo"
    OBJ_DIR: "${CI_PROJECT_DIR}/demo/build/CMakeFiles/main-Runner.dir" 
  script:
    - cd demo && mkdir build && cd build
    - cmake -D CMAKE_BUILD_TYPE=Profile ..
    - make && make test
    - gcovr -r ${SRC_DIR} -e '.*/catch.*|.*/Test.*' ${OBJ_DIR}
    - > 
      gcovr -r ${SRC_DIR} -e '.*/catch.*|.*/Test.*' --exclude-unreachable-branches --print-summary
      --xml-pretty -o coverage.xml --html=coverage.html ${OBJ_DIR}
  coverage: '/lines: (\s*\d+.\d+\%)/'
  artifacts:
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    expire_in: 45 days
    paths:
      - demo/build/coverage.xml
      - demo/build/coverage.html
      - demo/build/test-report.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: demo/build/coverage.xml
      junit: demo/build/test-report.xml
  rules:
    - if: ($CI_PIPELINE_SOURCE == "merge_request_event")
      when: always

performance-analysis:
  tags: 
    - docker-build
  stage: performance-test
  image: registry.git.chalmers.se/courses/dit638/students/2025-group-04/opencv-dev:4.10
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip
  script:
    - pip install -r python/requirements.txt
    - chmod +x run_and_compare.sh
    - ./run_and_compare.sh
  artifacts:
    paths:
      - res/steering_data/comparison_plots
  rules:
    - when: always

# This section describes what shall be done to deploy artefacts from the project.
#test
release:
  tags:
    - docker-build
  stage: deploy
  script:
    - echo "Create release"
    # Install buildx if not present
    - docker buildx version || (echo "Installing buildx..." && mkdir -p ~/.docker/cli-plugins && wget -qO ~/.docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.11.2/buildx-v0.11.2.linux-amd64 && chmod +x ~/.docker/cli-plugins/docker-buildx)
    - docker buildx create --use --name mybuilder
    - docker buildx inspect --bootstrap
    # Build and push the Docker image for multiple platforms when a release tag is created
    - docker buildx build --no-cache --progress=plain --provenance=false --platform linux/amd64,linux/arm/v7 -f Dockerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" --push .
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/' #only run this job on tags
      when: on_success
    - when: never #dont run on non-matching tags
